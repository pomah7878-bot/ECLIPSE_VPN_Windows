name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      
      - name: Clean old files
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path ".dart_tool") { Remove-Item -Recurse -Force ".dart_tool" }
      
      - name: Create Windows project
        run: flutter create --platforms windows --project-name eclipse_vpn_windows .
      
      - name: Fix CMake generator
        shell: pwsh
        run: |
          $file = "windows\CMakeLists.txt"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
            Set-Content $file $content -NoNewline
          }
          $file = "windows\runner\CMakeLists.txt"
          if (Test-Path $file) {
            $content = Get-Content $file -Raw
            $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
            Set-Content $file $content -NoNewline
          }
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Download sing-box
        shell: pwsh
        run: |
          $version = "1.8.0"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "."
          New-Item -ItemType Directory -Path "sing-box" -Force
          Move-Item -Path "sing-box-$version-windows-amd64\sing-box.exe" -Destination "sing-box\"
      
      - name: Download wintun
        shell: pwsh
        run: |
          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          Invoke-WebRequest -Uri $url -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "."
          New-Item -ItemType Directory -Path "wintun" -Force
                    $dll = Get-ChildItem -Path "." -Recurse -Filter "wintun.dll" | Where-Object { name: Build Windows Release

