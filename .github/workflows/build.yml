          Invoke-WebRequest -Uri $url -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "."
          New-Item -ItemType Directory -Path "wintun" -Force
          Move-Item -Path "wintun-0.14.1\bin\amd64\wintun.dll" -Destination "wintun\"
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE_VPN_Setup
          path: installer/ECLIPSE_VPN_Setup_*.exe
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: installer/ECLIPSE_VPN_Setup_*.exe
          generate_release_notes: true.FullName -match "amd64" } | Select-Object -First 1
          if ($dll) {
            Move-Item -Path $dll.FullName -Destination "wintun\"
          } else {
            throw "wintun.dll not found in archive"
          }
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
