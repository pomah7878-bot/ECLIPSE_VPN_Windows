name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SING_BOX_VERSION: "1.14.4"
  WINTUN_VERSION: "0.14.1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Download sing-box
        shell: pwsh
        run: |
          $version = $env:SING_BOX_VERSION
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "."
          New-Item -ItemType Directory -Path "sing-box" -Force
          Move-Item -Path "sing-box-$version-windows-amd64\sing-box.exe" -Destination "sing-box\"

      - name: Download wintun
        shell: pwsh
        run: |
          $url = "https://www.wintun.net/builds/wintun-$($env:WINTUN_VERSION).zip"
          Invoke-WebRequest -Uri $url -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "."
          New-Item -ItemType Directory -Path "wintun" -Force
          $dll = Get-ChildItem -Path "." -Recurse -Filter "wintun.dll" |
            Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if ($dll) {
            Move-Item -Path $dll.FullName -Destination "wintun\"
          } else {
            throw "wintun.dll (amd64) not found"
          }

      - name: Build Windows
        run: flutter build windows --release

      - name: Create installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE_VPN_Setup
          path: installer/ECLIPSE_VPN_Setup_*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/ECLIPSE_VPN_Setup_*.exe
          generate_release_notes: true
