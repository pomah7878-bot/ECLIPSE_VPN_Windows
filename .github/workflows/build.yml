name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      
      - name: Create Windows project
        run: flutter create --platforms windows --project-name eclipse_vpn_windows .
      
      - name: Fix CMakeLists.txt for VS 2022
        run: |
          $file = "windows\CMakeLists.txt"
          $content = Get-Content $file
          $content = $content -replace 'Visual Studio 16 2019', 'Visual Studio 17 2022'
          Set-Content $file $content
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Download sing-box
        run: |
          $version = "1.8.0"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "sing-box.zip"
          Expand-Archive -Path "sing-box.zip" -DestinationPath "."
          New-Item -ItemType Directory -Path "sing-box" -Force
          Move-Item -Path "sing-box-$version-windows-amd64\sing-box.exe" -Destination "sing-box\"
      
      - name: Build Windows
        run: flutter build windows --release
      
      - name: Create installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECLIPSE_VPN_Setup
          path: installer/ECLIPSE_VPN_Setup_*.exe
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: installer/ECLIPSE_VPN_Setup_*.exe
          generate_release_notes: true
