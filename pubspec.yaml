name: eclipse_vpn_windows
description: ECLIPSE VPN — Windows VPN client
publish_to: 'none'
version: 0.2.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Сеть
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Хранение
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.8.3

  # OAuth (PKCE SHA256)
  crypto: ^3.0.3
  url_launcher: ^6.2.2

  # Окно и трей
  window_manager: ^0.4.0
  tray_manager: ^0.5.0
  launch_at_startup: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
