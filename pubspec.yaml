name: eclipse_vpn_windows
description: ECLIPSE VPN — Windows VPN client
publish_to: 'none'
version: 0.1.22+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Состояние
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Сеть
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  retrofit: ^4.0.3
  
  # Хранение
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # OAuth
  url_launcher: ^6.2.2
  uni_links: ^0.5.1
  
  # Криптография (PKCE SHA256)
  crypto: ^3.0.3
  
  # Утилиты
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  window_manager: ^0.3.7
  tray_manager: ^0.2.0
  launch_at_startup: ^0.3.1
  
  # VPN
  process: ^5.0.2
  
  # Файлы
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true